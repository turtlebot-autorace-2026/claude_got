# 시뮬레이션 맵핑 주행 계획(가상 텔레옵). 좌표는 Gazebo 월드 좌표[m].
# 실차에서는 사람이 텔레옵으로 같은 순서로 주행하며 /route_recorder/segment 로 구간을 표시한다.
#
# step 종류
#   drive : 웨이포인트를 따라 주행. center=true면 바닥 텍스처로 차선 중앙에 맞춤(초기 좌표 보정용)
#           record: 경로 기록기에 넘길 구간 정보(name, speed, reverse, max_offset). 없으면 기록하지 않음
#   rotate: 월드 yaw[rad]로 제자리 회전
#   wait  : 초 단위 대기
sessions:
  # 세션 A: 왼쪽 갈림길로 전체 코스 + 주차 2칸 + 터널
  full_left:
    - drive:
        center: true
        record: {name: start_to_fork, speed: 0.22}
        points: [[0.687, -2.02], [1.30, -2.02], [1.62, -2.02], [1.85, -1.96], [1.98, -1.82], [2.0, -1.62], [2.0, -1.20],
                 [1.97, -1.02], [1.88, -0.91], [1.74, -0.87]]
    - drive:
        center: true
        record: {name: fork_left, speed: 0.18}
        points: [[1.74, -0.87], [1.58, -0.87], [1.47, -0.93], [1.42, -1.06], [1.42, -1.20], [1.38, -1.35], [1.27, -1.45],
                 [1.125, -1.495], [0.98, -1.45], [0.87, -1.35], [0.835, -1.20], [0.83, -1.02], [0.76, -0.90],
                 [0.62, -0.86], [0.48, -0.86]]
    - drive:
        center: true
        record: {name: merge_to_construction, speed: 0.22}
        points: [[0.48, -0.86], [0.36, -0.80], [0.29, -0.65], [0.28, -0.40], [0.28, -0.10], [0.31, 0.08], [0.40, 0.20],
                 [0.55, 0.265], [0.75, 0.27], [1.15, 0.27]]
    # 공사구간: 회피가 첫 장애물 전에 켜지고 마지막 장애물을 지난 뒤 꺼지도록 커브 앞~커브 뒤까지 포함
    - drive:
        center: true
        record: {name: construction, speed: 0.13, max_offset: 0.17}
        points: [[1.15, 0.27], [1.50, 0.28], [1.66, 0.31], [1.78, 0.40], [1.84, 0.52], [1.84, 0.90], [1.84, 1.30],
                 [1.84, 1.62], [1.82, 1.76], [1.78, 1.84]]
    - drive:
        center: true
        record: {name: to_parking, speed: 0.2}
        points: [[1.78, 1.84], [1.75, 1.88], [1.62, 1.96], [1.45, 1.985], [1.10, 1.985], [0.85, 1.985],
                 [0.74, 1.97], [0.64, 1.91], [0.58, 1.82], [0.56, 1.68], [0.56, 1.42]]
    # 주차칸: 진입 방향(-y) 기준 오른쪽 칸 = 월드 x 0.28, 왼쪽 칸 = 월드 x 0.84
    - drive:
        center: false
        record: {name: park_right_in, speed: 0.12}
        points: [[0.56, 1.42], [0.56, 1.28], [0.53, 1.16], [0.44, 1.05], [0.33, 0.97], [0.29, 0.88], [0.28, 0.80], [0.28, 0.76]]
    - wait: 1.0
    - drive:
        center: false
        reverse: true
        record: {name: park_right_out, speed: 0.12, reverse: true}
        points: [[0.28, 0.76], [0.28, 0.80], [0.29, 0.88], [0.33, 0.97], [0.44, 1.05], [0.53, 1.16], [0.56, 1.28], [0.56, 1.42]]
    - drive:
        center: false
        record: {name: park_left_in, speed: 0.12}
        points: [[0.56, 1.42], [0.56, 1.28], [0.59, 1.16], [0.68, 1.05], [0.79, 0.97], [0.83, 0.88], [0.84, 0.80], [0.84, 0.76]]
    - wait: 1.0
    - drive:
        center: false
        reverse: true
        record: {name: park_left_out, speed: 0.12, reverse: true}
        points: [[0.84, 0.76], [0.84, 0.80], [0.83, 0.88], [0.79, 0.97], [0.68, 1.05], [0.59, 1.16], [0.56, 1.28], [0.56, 1.42]]
    - rotate: 1.5708
    - drive:
        center: true
        record: {name: parking_exit, speed: 0.18}
        points: [[0.56, 1.42], [0.56, 1.65], [0.555, 1.80], [0.50, 1.91], [0.40, 1.97], [0.25, 1.985], [0.0, 1.99], [-0.25, 1.99]]
    - drive:
        center: true
        record: {name: to_crossing, speed: 0.2}
        points: [[-0.25, 1.99], [-0.32, 1.98], [-0.60, 1.855], [-0.90, 2.00], [-1.20, 2.15], [-1.47, 2.00], [-1.75, 2.00],
                 [-1.88, 1.98], [-1.98, 1.88], [-2.02, 1.72], [-1.98, 1.57], [-1.88, 1.47], [-1.75, 1.44], [-1.55, 1.44],
                 [-1.20, 1.44]]
    # 차단바 정지점: S1(-1.214)을 밟아 차단바를 내리고 S2(-0.985)에는 닿지 않는 위치(로봇 중심 -1.20)
    - drive:
        center: true
        record: {name: crossing_to_tunnel, speed: 0.2}
        points: [[-1.20, 1.44], [-0.80, 1.44], [-0.55, 1.43], [-0.40, 1.39], [-0.31, 1.30], [-0.28, 1.15], [-0.28, 0.75],
                 [-0.30, 0.50], [-0.38, 0.36], [-0.52, 0.29], [-0.80, 0.29], [-1.20, 0.29], [-1.33, 0.32], [-1.43, 0.42],
                 [-1.48, 0.56], [-1.53, 0.71], [-1.63, 0.82], [-1.75, 0.865], [-1.88, 0.82], [-1.97, 0.70], [-2.0, 0.55],
                 [-2.0, 0.30], [-2.0, 0.20]]
    - drive:
        center: false
        record: {name: tunnel_entry, speed: 0.12}
        points: [[-2.0, 0.20], [-2.04, 0.10], [-2.075, 0.0], [-2.08, -0.15], [-2.08, -0.32]]
    - drive:
        center: false
        record: {name: tunnel_inside, speed: 0.12}
        points: [[-2.08, -0.32], [-2.0, -0.50], [-1.85, -0.65], [-1.70, -0.77], [-1.45, -1.00], [-1.10, -1.12],
                 [-0.75, -1.15], [-0.45, -1.35], [-0.32, -1.60], [-0.30, -1.85], [-0.29, -1.98]]
    - drive:
        center: false
        record: {name: tunnel_exit, speed: 0.12}
        points: [[-0.29, -1.98], [-0.25, -2.08], [-0.15, -2.12], [0.0, -2.12], [0.15, -2.10], [0.30, -2.05],
                 [0.45, -2.025], [0.60, -2.02]]

  # 세션 B: 오른쪽 갈림길만 추가 맵핑(기존 맵 확장)
  right_branch:
    - drive:
        center: true
        points: [[0.687, -2.02], [1.30, -2.02], [1.62, -2.02], [1.85, -1.96], [1.98, -1.82], [2.0, -1.62], [2.0, -1.20],
                 [1.97, -1.02], [1.88, -0.91], [1.74, -0.87]]
    - drive:
        center: true
        record: {name: fork_right, speed: 0.18}
        points: [[1.74, -0.87], [1.58, -0.80], [1.47, -0.70], [1.42, -0.58], [1.38, -0.45], [1.27, -0.34], [1.125, -0.30],
                 [0.98, -0.34], [0.87, -0.45], [0.84, -0.60], [0.83, -0.72], [0.76, -0.83], [0.62, -0.86], [0.48, -0.86]]
    - drive:
        center: true
        points: [[0.48, -0.86], [0.36, -0.80], [0.29, -0.65], [0.28, -0.40]]
